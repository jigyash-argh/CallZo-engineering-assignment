services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: callzo_user
      POSTGRES_PASSWORD: callzo_password
      POSTGRES_DB: callzo_usage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: api
    ports:
      - "8000:8080"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - LOG_IGNORE_PATH=/favicon.ico

  simulator:
    image: meetrj/callzo-webhook-simulator
    platform: linux/arm64
    container_name: simulator
    depends_on:
      - api
    command: ["--url", "http://api:8080/webhooks/calls", "--scenario", "duplicates"]

volumes:
  postgres_data: